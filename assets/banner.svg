<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="50%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <!-- Subtle Premium Glows -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="badgeBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d30" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Ambient Lighting Filters -->
    <filter id="softGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
    <filter id="softGlowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="devGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.2"/>
      <circle cx="40" cy="40" r="1.2" fill="#6366f1" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .font-code { font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title-bold { font-weight: 850; letter-spacing: -0.025em; }
    .badge-label { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Background Base -->
  <rect width="1280" height="400" rx="16" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="180" cy="100" r="150" fill="#0284c7" opacity="0.18" filter="url(#softGlowCyan)"/>
  <circle cx="1100" cy="120" r="160" fill="#7c3aed" opacity="0.18" filter="url(#softGlowViolet)"/>
  <circle cx="640" cy="380" r="140" fill="#db2777" opacity="0.12" filter="url(#softGlowCyan)"/>

  <!-- Developer Grid Overlay -->
  <rect width="1280" height="400" rx="16" fill="url(#devGrid)"/>

  <!-- Outer Elegant Border -->
  <rect x="1.5" y="1.5" width="1277" height="397" rx="15" fill="none" stroke="url(#badgeBorderGrad)" stroke-width="1.5"/>

  <!-- Abstract Code Bracket Graphics (Watermark Style) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M 1120 180 L 1180 240 L 1120 300"/>
    <path d="M 1040 180 L 980 240 L 1040 300"/>
    <line x1="1085" y1="180" x2="1055" y2="300"/>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 28 48 L 28 28 L 48 28" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <path d="M 1252 48 L 1252 28 L 1232 28" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.7"/>
  <path d="M 28 352 L 28 372 L 48 372" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
  <path d="M 1252 352 L 1252 372 L 1232 372" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.7"/>

  <!-- Status Pill (Top Left) -->
  <g transform="translate(64, 46)">
    <rect width="260" height="32" rx="16" fill="#0b1120" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="20" cy="16" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="21" class="font-code" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1">
      SYSTEM.STATUS: ONLINE
    </text>
  </g>

  <!-- Location Badge (Top Right) -->
  <g transform="translate(970, 46)">
    <rect width="246" height="32" rx="16" fill="#0b1120" fill-opacity="0.9" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="24" y="21" class="font-code" font-size="12.5" font-weight="500" fill="#94a3b8">
      📍 Karachi, Pakistan
    </text>
  </g>

  <!-- Main Hero Heading -->
  <text x="64" y="152" class="font-sans title-bold" font-size="58" fill="url(#nameGrad)">
    NASRULLAH DILSHAD
  </text>

  <!-- Role Subtitle -->
  <text x="66" y="196" class="font-sans" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">
    FULL-STACK WEB DEVELOPER
  </text>

  <!-- Tech Focus Strip -->
  <text x="66" y="228" class="font-sans" font-size="16" font-weight="500" fill="#94a3b8">
    React.js <tspan fill="#64748b">•</tspan> Next.js <tspan fill="#64748b">•</tspan> Node.js <tspan fill="#64748b">•</tspan> TypeScript <tspan fill="#64748b">•</tspan> MongoDB <tspan fill="#64748b">•</tspan> AI &amp; API Integration
  </text>

  <!-- Tech Stack Badges Row -->
  <g transform="translate(64, 266)">
    <!-- React.js -->
    <g transform="translate(0, 0)">
      <rect width="112" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#38bdf8"/>
      <text x="34" y="24" class="font-sans badge-label">React.js</text>
    </g>

    <!-- Next.js -->
    <g transform="translate(122, 0)">
      <rect width="105" height="38" rx="8" fill="url(#cardGrad)" stroke="#cbd5e1" stroke-width="1" stroke-opacity="0.4"/>
      <circle cx="20" cy="19" r="5" fill="#ffffff"/>
      <text x="34" y="24" class="font-sans badge-label">Next.js</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(237, 0)">
      <rect width="108" height="38" rx="8" fill="url(#cardGrad)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#22c55e"/>
      <text x="34" y="24" class="font-sans badge-label">Node.js</text>
    </g>

    <!-- TypeScript -->
    <g transform="translate(355, 0)">
      <rect width="126" height="38" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#3b82f6"/>
      <text x="34" y="24" class="font-sans badge-label">TypeScript</text>
    </g>

    <!-- MongoDB -->
    <g transform="translate(491, 0)">
      <rect width="118" height="38" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#10b981"/>
      <text x="34" y="24" class="font-sans badge-label">MongoDB</text>
    </g>

    <!-- AI & APIs -->
    <g transform="translate(619, 0)">
      <rect width="140" height="38" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="20" cy="19" r="5" fill="#c084fc"/>
      <text x="34" y="24" class="font-sans badge-label">AI &amp; APIs</text>
    </g>

    <!-- Tailwind -->
    <g transform="translate(769, 0)">
      <rect width="124" height="38" rx="8" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#06b6d4"/>
      <text x="34" y="24" class="font-sans badge-label">Tailwind CSS</text>
    </g>

    <!-- Flutter & Python -->
    <g transform="translate(903, 0)">
      <rect width="142" height="38" rx="8" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#f59e0b"/>
      <text x="34" y="24" class="font-sans badge-label">Python &amp; Flutter</text>
    </g>

    <!-- Git & Cloud -->
    <g transform="translate(1055, 0)">
      <rect width="161" height="38" rx="8" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.45"/>
      <circle cx="20" cy="19" r="5" fill="#f43f5e"/>
      <text x="34" y="24" class="font-sans badge-label">Git &amp; Cloud</text>
    </g>
  </g>

  <!-- Subtle Bottom Divider Line -->
  <rect x="64" y="340" width="1152" height="1" fill="#334155" opacity="0.4"/>

  <!-- Footer Info Line -->
  <g transform="translate(64, 366)">
    <text class="font-code" font-size="12" fill="#64748b">
      &gt; echo <tspan fill="#38bdf8">"Modern Architectures • Robust REST APIs • High-Throughput Experiences"</tspan>
    </text>
  </g>

  <g transform="translate(1005, 366)">
    <text class="font-code" font-size="12" fill="#64748b">
      GITHUB: <tspan fill="#818cf8">@nasrullahmemon13</tspan>
    </text>
  </g>
</svg>